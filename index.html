<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LensLife - フォトギャラリー</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; color: #fff; font-family: 'Segoe UI', sans-serif; }
    header { padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; position: fixed; top: 0; width: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); z-index: 100; }
    .logo { font-size: 1.3rem; font-weight: 300; letter-spacing: 4px; text-transform: uppercase; }
    .logo span { color: #f0b429; }
    nav a { color: #ccc; text-decoration: none; margin-left: 24px; font-size: 0.85rem; letter-spacing: 1px; text-transform: uppercase; }
    nav a:hover { color: #f0b429; }
    .hero { height: 100vh; background: linear-gradient(45deg, #111 0%, #222 50%, #111 100%); display: flex; align-items: center; justify-content: center; text-align: center; padding-top: 60px; }
    .hero h1 { font-size: 3.5rem; font-weight: 200; letter-spacing: 8px; margin-bottom: 20px; }
    .hero p { color: #aaa; font-size: 1rem; letter-spacing: 2px; margin-bottom: 36px; }
    .btn { display: inline-block; border: 1px solid #f0b429; color: #f0b429; padding: 12px 32px; text-decoration: none; letter-spacing: 2px; font-size: 0.85rem; text-transform: uppercase; transition: all .2s; }
    .btn:hover { background: #f0b429; color: #111; }
    .gallery-section { padding: 80px 20px; }
    .gallery-section h2 { text-align: center; font-weight: 200; font-size: 1.8rem; letter-spacing: 4px; margin-bottom: 12px; }
    .filter-bar { display: flex; justify-content: center; gap: 12px; margin-bottom: 40px; flex-wrap: wrap; }
    .filter-btn { background: none; border: 1px solid #444; color: #aaa; padding: 6px 20px; cursor: pointer; font-size: 0.8rem; letter-spacing: 1px; text-transform: uppercase; transition: all .2s; border-radius: 2px; }
    .filter-btn.active, .filter-btn:hover { border-color: #f0b429; color: #f0b429; }
    .masonry { columns: 3; column-gap: 12px; max-width: 1200px; margin: 0 auto; }
    .photo { break-inside: avoid; margin-bottom: 12px; position: relative; overflow: hidden; cursor: pointer; }
    .photo-inner { width: 100%; display: block; background: #222; transition: transform .3s; }
    .photo:hover .photo-inner { transform: scale(1.03); }
    .photo-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.6); opacity: 0; transition: opacity .3s; display: flex; align-items: center; justify-content: center; flex-direction: column; }
    .photo:hover .photo-overlay { opacity: 1; }
    .photo-overlay p { font-size: 0.85rem; color: #f0b429; letter-spacing: 2px; }
    .h-short { height: 200px; }
    .h-medium { height: 280px; }
    .h-tall { height: 360px; }
    footer { text-align: center; padding: 40px; color: #555; border-top: 1px solid #222; font-size: 0.85rem; }
    @media (max-width: 768px) { .masonry { columns: 2; } .hero h1 { font-size: 2rem; } }
  </style>
</head>
<body>
  <header>
    <div class="logo">Lens<span>Life</span></div>
    <nav>
      <a href="#">作品</a>
      <a href="#">コレクション</a>
      <a href="#">購入</a>
      <a href="#">お問い合わせ</a>
    </nav>
  </header>

  <div class="hero">
    <div>
      <h1>CAPTURING<br>MOMENTS</h1>
      <p>光と影が語る、瞬間の美しさ</p>
      <a href="#gallery" class="btn">ギャラリーを見る</a>
    </div>
  </div>

  <div class="gallery-section" id="gallery">
    <h2>GALLERY</h2>
    <div class="filter-bar">
      <button class="filter-btn active">すべて</button>
      <button class="filter-btn">風景</button>
      <button class="filter-btn">ポートレート</button>
      <button class="filter-btn">建築</button>
      <button class="filter-btn">ストリート</button>
    </div>
    <div class="masonry">
      <div class="photo">
        <div class="photo-inner h-tall" style="background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);"></div>
        <div class="photo-overlay"><p>🌃 夜景</p></div>
      </div>
      <div class="photo">
        <div class="photo-inner h-short" style="background: linear-gradient(135deg, #2d6a4f, #40916c, #74c69d);"></div>
        <div class="photo-overlay"><p>🌿 森林</p></div>
      </div>
      <div class="photo">
        <div class="photo-inner h-medium" style="background: linear-gradient(135deg, #d62828, #f77f00, #fcbf49);"></div>
        <div class="photo-overlay"><p>🌅 夕焼け</p></div>
      </div>
      <div class="photo">
        <div class="photo-inner h-medium" style="background: linear-gradient(135deg, #4a4e69, #9a8c98, #c9ada7);"></div>
        <div class="photo-overlay"><p>👤 ポートレート</p></div>
      </div>
      <div class="photo">
        <div class="photo-inner h-tall" style="background: linear-gradient(135deg, #0077b6, #0096c7, #00b4d8);"></div>
        <div class="photo-overlay"><p>🌊 海</p></div>
      </div>
      <div class="photo">
        <div class="photo-inner h-short" style="background: linear-gradient(135deg, #6d6875, #b5838d, #e5989b);"></div>
        <div class="photo-overlay"><p>🌸 花</p></div>
      </div>
      <div class="photo">
        <div class="photo-inner h-medium" style="background: linear-gradient(135deg, #333, #555, #777);"></div>
        <div class="photo-overlay"><p>🏙 建築</p></div>
      </div>
      <div class="photo">
        <div class="photo-inner h-short" style="background: linear-gradient(135deg, #264653, #2a9d8f, #e9c46a);"></div>
        <div class="photo-overlay"><p>🌄 山</p></div>
      </div>
      <div class="photo">
        <div class="photo-inner h-tall" style="background: linear-gradient(135deg, #1b1b2f, #2e2e5e, #4a4a8a);"></div>
        <div class="photo-overlay"><p>✨ 星空</p></div>
      </div>
    </div>
  </div>

  <footer>
    <p>&copy; 2025 LensLife Photography | すべての写真の著作権は撮影者に帰属します</p>
  </footer>
</body>
</html>
